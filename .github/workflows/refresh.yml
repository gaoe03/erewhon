name: refresh smoothies

# Runs on the 1st and 15th (about every two weeks), plus a manual button.
# The 2nd and 16th are catch-up days that run only if the day before produced no PR.
on:
  schedule:
    - cron: '0 14 1,2,15,16 * *'
  workflow_dispatch:
  pull_request:

permissions:
  contents: read

# Never let a scheduled run and a manual run overlap on the shared refresh branch.
concurrency:
  group: refresh-${{ github.event.pull_request.number || 'scheduled' }}
  cancel-in-progress: false

jobs:
  validate:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: run offline pipeline tests
        run: node --test tests/*.test.mjs
      - name: validate archive and generated data
        run: |
          node scripts/health.mjs
          node scripts/build-data.mjs --check
          node scripts/ingredient-audit.mjs --check

  # A catch-up run proceeds only when no refresh since the day before reached its PR step.
  gate:
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    permissions:
      actions: read
    outputs:
      run: ${{ steps.check.outputs.run }}
    steps:
      - name: check for a proposal from the day before
        id: check
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          EVENT: ${{ github.event_name }}
          RUN_ID: ${{ github.run_id }}
        run: |
          day=$(date -u +%d)
          if [ "$EVENT" != schedule ] || { [ "$day" != 02 ] && [ "$day" != 16 ]; }; then
            echo 'run=true' >> "$GITHUB_OUTPUT"
            exit 0
          fi
          since=$(date -u -d yesterday +%Y-%m-%d)
          for id in $(gh api "repos/$GH_REPO/actions/workflows/refresh.yml/runs?created=>=$since&per_page=50" \
              --jq ".workflow_runs[] | select(.id != $RUN_ID and (.event == \"schedule\" or .event == \"workflow_dispatch\")) | .id"); do
            # Matches the step name of the PR step below. Rename both together.
            opened=$(gh api "repos/$GH_REPO/actions/runs/$id/jobs" \
              --jq '[.jobs[].steps[]? | select(.name == "open a pull request if anything changed" and .conclusion == "success")] | length')
            if [ "$opened" != 0 ]; then
              echo "Run $id already opened or updated the proposal. Skipping the catch-up."
              echo 'run=false' >> "$GITHUB_OUTPUT"
              exit 0
            fi
          done
          echo 'No proposal since yesterday. Running the catch-up.'
          echo 'run=true' >> "$GITHUB_OUTPUT"

  refresh:
    needs: gate
    if: needs.gate.outputs.run == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
      pull-requests: write
      issues: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: validate current archive
        run: |
          node --test tests/*.test.mjs
          node scripts/health.mjs
          node scripts/build-data.mjs --check
          node scripts/ingredient-audit.mjs --check

      # Playwright checks each current drink's product page for recipe changes.
      # Installed only in the runner, so the static site stays dependency free.
      - name: install playwright
        run: |
          npm init -y
          npm install --no-save playwright@1.55.0
          npx playwright install --with-deps chromium

      - name: run the pipeline
        env:
          ALGOLIA_APP_ID: ${{ secrets.ALGOLIA_APP_ID }}
          ALGOLIA_API_KEY: ${{ secrets.ALGOLIA_API_KEY }}
          ALGOLIA_INDEX: ${{ secrets.ALGOLIA_INDEX }}
        run: node scripts/run.mjs --apply

      - name: validate the proposed refresh
        run: |
          node --test tests/*.test.mjs
          node scripts/health.mjs
          node scripts/build-data.mjs --check
          node scripts/ingredient-audit.mjs --low-use

      # Save the check result before the PR action restores the base checkout.
      - name: audit proposed ingredient mappings
        id: mappings
        continue-on-error: true
        run: node scripts/ingredient-audit.mjs --check

      - name: check whether editorial review is needed
        id: review
        run: |
          node --input-type=module - <<'NODE'
          import fs from 'node:fs';
          const rows = JSON.parse(fs.readFileSync('data/smoothies.json', 'utf8'));
          const menu = JSON.parse(fs.readFileSync('data/menu.json', 'utf8'));
          const needed = rows.some((row) => menu.smoothieIds.includes(row.id) && row.needsReview);
          fs.appendFileSync(process.env.GITHUB_OUTPUT, `needed=${needed}\n`);
          NODE

      # Only opens a PR if data actually changed. add-paths keeps node_modules and
      # the ephemeral package.json out of the commit. Merging deploys via Vercel.
      - name: open a pull request if anything changed
        id: proposal
        uses: peter-evans/create-pull-request@v6
        with:
          add-paths: |
            data/smoothies.json
            data/menu.json
            data.js
            img/**
          branch: smoothie-refresh
          title: Menu refresh from the tonic bar
          commit-message: refresh smoothies
          committer: gaoe03 <gaoe2003@gmail.com>
          author: gaoe03 <gaoe2003@gmail.com>
          body-path: pr-body.md
          labels: automated
          draft: ${{ steps.review.outputs.needed == 'true' }}

      # The action's draft input only applies when creating a PR. An existing
      # proposal must also return to draft when a later refresh needs review.
      - name: keep unresolved proposals in draft
        if: steps.review.outputs.needed == 'true' && steps.proposal.outputs.pull-request-number
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ steps.proposal.outputs.pull-request-number }}
        run: |
          if [ "$(gh pr view "$PR_NUMBER" --json isDraft --jq '.isDraft')" = 'false' ]; then
            gh pr ready "$PR_NUMBER" --undo
          fi

      # A later run that reaches its PR resolves any earlier crash report.
      - name: close the failure issue after a successful proposal
        if: steps.proposal.outputs.pull-request-number
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          PR_URL: ${{ steps.proposal.outputs.pull-request-url }}
        run: |
          number=$(gh issue list --state open --search '"Smoothie refresh failed" in:title' --json number --jq '.[0].number // empty')
          if [ -n "$number" ]; then
            gh issue close "$number" --comment "A later refresh succeeded and updated $PR_URL."
          fi

      # Token-created PR workflows can require approval. Enforce the saved result
      # after the draft exists, without rechecking the restored base checkout.
      - name: require reviewed ingredient mappings
        if: steps.mappings.outcome == 'failure'
        run: |
          echo 'The saved proposal contains unreviewed ingredient labels. Resolve them in the draft PR.'
          exit 1

      # A crash before the PR step leaves nothing to review, so nobody notices.
      # Open an issue instead. A draft PR with unreviewed labels is not a crash.
      - name: report a refresh that stopped before its pull request
        if: (failure() || cancelled()) && !steps.proposal.outputs.pull-request-number
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          EVENT: ${{ github.event_name }}
          OWNER: ${{ github.repository_owner }}
        run: |
          title='Smoothie refresh failed'
          body="The $EVENT refresh stopped before it opened a pull request. Logs: $RUN_URL"
          number=$(gh issue list --state open --search "\"$title\" in:title" --json number --jq '.[0].number // empty')
          if [ -n "$number" ]; then
            gh issue comment "$number" --body "$body"
          else
            gh issue create --title "$title" --body "$body" --assignee "$OWNER"
          fi
